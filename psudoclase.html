<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estructura de 22 Cajas con Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #FAF3E0;
        }

        .caja {
            color: #ffffff;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .caja:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
        }

        /* NAV */
        .caja1 {
            min-height: 80px;
            background-color: #264653;
        }

        /* CAJA 2 */
        .caja2 {
            min-height: 200px;
            background-color: #2A9D8F;
            font-size: 1.75rem;
        }

        /* CAJAS 3 Y 4 */
        .caja3 {
            min-height: 150px;
            background-color: #E9C46A;
            color: #264653;
            font-size: 1.35rem;
        }

        .caja4 {
            min-height: 150px;
            background-color: #F4A261;
            color: #264653;
            font-size: 1.35rem;
        }

        /* GRID 6x3 */
        .caja-grid {
            min-height: 110px;
            font-size: 1.1rem;
        }

        .caja5 {
            background-color: #E76F51;
        }

        .caja6 {
            background-color: #287271;
        }

        .caja7 {
            background-color: #D4A373;
            color: #264653;
        }

        .caja8 {
            background-color: #8AB17D;
            color: #264653;
        }

        .caja9 {
            background-color: #EF8354;
        }

        .caja10 {
            background-color: #1B4332;
        }

        .caja11 {
            background-color: #52B788;
            color: #264653;
        }

        .caja12 {
            background-color: #2A9D8F;
        }

        .caja13 {
            background-color: #76C893;
            color: #264653;
        }

        .caja14 {
            background-color: #264653;
        }

        .caja15 {
            background-color: #E9C46A;
            color: #264653;
        }

        .caja16 {
            background-color: #F4A261;
            color: #264653;
        }

        .caja17 {
            background-color: #E76F51;
        }

        .caja18 {
            background-color: #D4A373;
            color: #264653;
        }

        .caja19 {
            background-color: #287271;
        }

        .caja20 {
            background-color: #8AB17D;
            color: #264653;
        }

        .caja21 {
            background-color: #EF8354;
        }

        .caja22 {
            background-color: #1B4332;
        }

        .btn-nav {
            margin: 20px auto;
            display: block;
            width: fit-content;
        }
    </style>
</head>

<body class="py-4">

    <div class="container">

        <!-- CAJA 1: NAVEGACIÓN -->
        <header class="row mb-4">

            <div class="col-12">

                <nav class="caja caja1 justify-content-between flex-wrap gap-3">

                    <span class="fs-4 text-uppercase">
                        CAJA N1
                    </span>

                    <div class="d-flex gap-2 flex-wrap justify-content-center">

                        <a href="#" class="btn btn-outline-light btn-sm px-3">
                            Enlace 1
                        </a>

                        <a href="#" class="btn btn-outline-light btn-sm px-3">
                            Enlace 2
                        </a>

                        <a href="#" class="btn btn-outline-light btn-sm px-3">
                            Enlace 3
                        </a>

                        <a href="#" class="btn btn-outline-light btn-sm px-3">
                            Enlace 4
                        </a>

                    </div>

                </nav>

            </div>

        </header>

        <!-- CAJA 2 -->
        <section class="row mb-4">

            <div class="col-12">

                <div class="caja caja2">
                    CAJA N2
                </div>

            </div>

        </section>

        <!-- CAJAS 3 Y 4 -->
        <section class="row g-3 mb-4">

            <div class="col-12 col-md-6">

                <div class="caja caja3">
                    CAJA N3
                </div>

            </div>

            <div class="col-12 col-md-6">

                <div class="caja caja4">
                    CAJA N4
                </div>

            </div>

        </section>

        <!-- CAJAS 5 A 22 -->
        <section class="mb-4">

            <!-- FILA 1: CAJAS 5 A 10 -->
            <div class="row g-3 mb-3">

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja5">
                        CAJA N5
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja6">
                        CAJA N6
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja7">
                        CAJA N7
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja8">
                        CAJA N8
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja9">
                        CAJA N9
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja10">
                        CAJA N10
                    </div>
                </div>

            </div>

            <!-- FILA 2: CAJAS 11 A 16 -->
            <div class="row g-3 mb-3">

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja11">
                        CAJA N11
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja12">
                        CAJA N12
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja13">
                        CAJA N13
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja14">
                        CAJA N14
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja15">
                        CAJA N15
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja16">
                        CAJA N16
                    </div>
                </div>

            </div>

            <!-- FILA 3: CAJAS 17 A 22 -->
            <div class="row g-3">

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja17">
                        CAJA N17
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja18">
                        CAJA N18
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja19">
                        CAJA N19
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja20">
                        CAJA N20
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja21">
                        CAJA N21
                    </div>
                </div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja22">
                        CAJA N22
                    </div>
                </div>

            </div>

        </section>

        <a href="index.html" class="btn btn-lg btn-nav" style="background-color: #E76F51; color: #ffffff;">
            ← Volver al Inicio
        </a>

    </div>

    <!-- JAVASCRIPT DE BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
